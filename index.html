<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cristais de Aether</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b0e14; touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    position: fixed; top: 0; left: 0; width: 100%;
    height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    background: #0b0e14;
  }
  canvas {
    width: 100%; height: 100%; object-fit: contain;
    display: block; image-rendering: auto; touch-action: none; background: #0b0e14;
  }
  #loading {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px;
    background: radial-gradient(circle at 50% 40%, #1a2030 0%, #0b0e14 70%);
    color: #f2e6c8; text-align: center;
  }
  #loading h1 { margin: 0; font-size: clamp(24px, 6vw, 44px); letter-spacing: 2px; color: #e8c97a; }
  #msg { margin: 0; font-size: clamp(13px, 3.4vw, 18px); color: #cfc6b0; }
  #bar { width: min(420px, 78vw); height: 8px; border-radius: 99px; background: #222a38; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #b98b3c, #f0d48a); transition: width .25s ease; }
  #err { max-width: min(680px, 90vw); max-height: 34vh; overflow: auto; white-space: pre-wrap;
         text-align: left; font-size: 12px; color: #ffb4b4; background: #1a1014; padding: 10px;
         border-radius: 8px; display: none; }
  #start {
    margin-top: 8px; padding: 14px 34px; border: 1px solid #e8c97a; border-radius: 12px;
    background: #2a2116; color: #f6e6bd; font-size: clamp(16px, 4vw, 22px); font-weight: 700;
    letter-spacing: 1px; cursor: pointer; touch-action: manipulation;
  }
  #start:active { background: #3a2d1c; }
  #full {
    position: fixed; right: 12px; bottom: 12px; z-index: 30; display: none;
    padding: 10px 14px; border-radius: 10px; border: 1px solid #6b5a3a;
    background: rgba(18, 22, 30, .82); color: #e8d9b0; font-size: 13px;
  }
  #rotate {
    position: fixed; inset: 0; z-index: 40; display: none;
    align-items: center; justify-content: center; text-align: center;
    background: #0b0e14; color: #e8c97a; font-size: 20px; padding: 30px;
  }
  @media (orientation: portrait) {
    #rotate { display: flex; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas" width="1280" height="720"></canvas></div>

<div id="loading">
  <h1>CRISTAIS DE AETHER</h1>
  <p id="msg">Toque para começar</p>
  <div id="bar"><div></div></div>
  <button id="start">Toque para começar</button>
  <pre id="err"></pre>
</div>

<div id="rotate">Gire o celular para a horizontal<br>para jogar melhor.</div>
<button id="full">Tela cheia</button>

<script src="https://cdn.jsdelivr.net/pyodide/v0.29.1/full/pyodide.js"></script>
<script>
const loading = document.getElementById("loading");
const msg = document.getElementById("msg");
const bar = document.querySelector("#bar > div");
const errBox = document.getElementById("err");
const startBtn = document.getElementById("start");
const canvas = document.getElementById("canvas");
const fullBtn = document.getElementById("full");

const modoToque = window.matchMedia("(pointer: coarse)").matches
  || (navigator.maxTouchPoints > 0 && window.matchMedia("(hover: none)").matches);
if (!modoToque) {
  msg.textContent = "Clique para começar";
  startBtn.textContent = "Clique para começar";
}

// Ponte de toque: o Safari entrega os dedos aqui e o Python lê a fila.
const toques = window.cristaisToques = [];
window.consumirToques = () => {
  const fila = window.cristaisToques.slice();
  window.cristaisToques.length = 0;
  return fila;
};
if (modoToque) {
  const dedosAtivos = new Set();
  function coordToque(e) {
    const r = canvas.getBoundingClientRect();
    const escala = Math.min(r.width / 1280, r.height / 720);
    const largura = 1280 * escala;
    const altura = 720 * escala;
    const offX = (r.width - largura) / 2;
    const offY = (r.height - altura) / 2;
    return {
      x: (e.clientX - r.left - offX) / Math.max(0.0001, escala),
      y: (e.clientY - r.top - offY) / Math.max(0.0001, escala),
    };
  }
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    dedosAtivos.add(e.pointerId);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    const p = coordToque(e);
    toques.push({ tipo: "down", id: e.pointerId, x: p.x, y: p.y });
  }, { passive: false });
  canvas.addEventListener("pointermove", (e) => {
    if (!dedosAtivos.has(e.pointerId)) return;
    e.preventDefault();
    const p = coordToque(e);
    toques.push({ tipo: "move", id: e.pointerId, x: p.x, y: p.y });
  }, { passive: false });
  function soltarDedo(e) {
    if (!dedosAtivos.has(e.pointerId)) return;
    dedosAtivos.delete(e.pointerId);
    const p = coordToque(e);
    toques.push({ tipo: "up", id: e.pointerId, x: p.x, y: p.y });
  }
  canvas.addEventListener("pointerup", soltarDedo);
  canvas.addEventListener("pointercancel", soltarDedo);
  canvas.addEventListener("pointerleave", (e) => {
    if (e.pointerType === "mouse") soltarDedo(e);
  });
}

function progress(pct, texto) {
  bar.style.width = Math.max(0, Math.min(100, pct)) + "%";
  if (texto) msg.textContent = texto;
}

function mostrarErro(erro) {
  console.error(erro);
  loading.style.display = "flex";
  startBtn.style.display = "none";
  errBox.style.display = "block";
  var detalhe = String(erro && erro.stack ? erro.stack : erro);
  // Adiciona informações de diagnóstico
  detalhe += "\n\n--- Diagnóstico ---";
  detalhe += "\nNavegador: " + navigator.userAgent;
  detalhe += "\nConexão: " + (navigator.onLine ? "online" : "offline");
  detalhe += "\nHora: " + new Date().toISOString();
  errBox.textContent = detalhe;
  msg.textContent = "Não foi possível iniciar o jogo.";
}

async function iniciarJogo() {
  startBtn.style.display = "none";
  progress(4, "Carregando o motor Python...");
  // Tenta carregar o lock file local para evitar dependência de CDN externo.
  let lockFileContents = null;
  for (let tentativa = 1; tentativa <= 3; tentativa++) {
    try {
      const lockResp = await fetch("pyodide-lock.json", { cache: "no-store" });
      if (lockResp.ok) {
        lockFileContents = await lockResp.text();
        progress(8, "Lock file local carregado.");
        break;
      }
    } catch (e) {
      console.warn("Tentativa " + tentativa + " falhou:", e);
      if (tentativa < 3) await new Promise(r => setTimeout(r, 1000));
    }
  }
  if (!lockFileContents) {
    console.warn("Lock file local indisponível, usando padrão do CDN.");
  }
  const pyodide = await loadPyodide(lockFileContents ? { lockFileContents, packages: ["pygame-ce"], indexURL: "https://cdn.jsdelivr.net/pyodide/v0.29.1/full/" } : { packages: ["pygame-ce"], indexURL: "https://cdn.jsdelivr.net/pyodide/v0.29.1/full/" });
  window.pyodide = pyodide;

  progress(24, "Preparando o canvas...");
  pyodide.canvas.setCanvas2D(canvas);

  progress(52, "Baixando o jogo...");
  const resposta = await fetch("game.zip", { cache: "no-store" });
  if (!resposta.ok) throw new Error("game.zip não encontrado (" + resposta.status + ")");
  const buffer = await resposta.arrayBuffer();

  progress(70, "Descompactando...");
  await pyodide.unpackArchive(buffer, "zip", { extractDir: "/game" });

  // Persistência do save no IndexedDB (quando disponível).
  try {
    pyodide.FS.mkdirTree("/data");
    const idbfs = pyodide.FS.filesystems && pyodide.FS.filesystems.IDBFS;
    if (!idbfs) throw new Error("IDBFS indisponível");
    pyodide.FS.mount(idbfs, {}, "/data");
    await new Promise((ok, falha) => pyodide.FS.syncfs(true, e => e ? falha(e) : ok()));
    setInterval(() => { try { pyodide.FS.syncfs(false, () => {}); } catch (e) {} }, 4000);
    progress(80, "Progresso será salvo neste navegador.");
  } catch (e) {
    console.warn("Persistência indisponível:", e);
    progress(80, "Modo sem salvamento automático.");
  }

  progress(88, "Iniciando Cristais de Aether...");
  window.cristaisToques.length = 0;
  const execucao = pyodide.runPythonAsync(`
import os, sys
os.environ["CRISTAIS_WEB"] = "1"
os.environ["CRISTAIS_TOQUE"] = "${modoToque ? "1" : "0"}"
os.environ["CRISTAIS_SEM_AUDIO"] = "1"
os.chdir("/game")
sys.path.insert(0, "/game")
import main
await main.main()
`);

  // A tela de carregamento some quando o jogo começa a desenhar.
  setTimeout(() => {
    if (errBox.style.display !== "block") {
      loading.style.display = "none";
    }
  }, 2200);

  await execucao;
}

startBtn.addEventListener("click", () => {
  iniciarJogo().catch(mostrarErro);
});

if (document.documentElement.requestFullscreen) {
  fullBtn.style.display = "block";
  fullBtn.addEventListener("click", () => {
    document.documentElement.requestFullscreen().catch(() => {});
  });
}

document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
</script>
</body>
</html>
